[project]
name = "flipcontrol-ai-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate",
  "datasets",
  "fastapi",
  "httpx",
  "peft",
  "pydantic",
  "python-multipart",
  "safetensors",
  "transformers",
  "uvicorn",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
